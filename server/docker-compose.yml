services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bff
      POSTGRES_PASSWORD: bff
      POSTGRES_DB: bff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bff -d bff"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
